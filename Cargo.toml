# The Rust version of Pixheet. Read spike/PLAN.md for the plan of the port.
[workspace]
resolver = "3"
members = ["crates/pixheet-core", "crates/pixheet-cli", "crates/pixheet-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Dinh-Anh Vu <anhvd27@gmail.com>"]
repository = "https://github.com/adv27/pixheet"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The image code is slow without optimization. Optimize it in the test and debug builds
# too, so the tests and `cargo run` stay fast.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.pixheet-core]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1

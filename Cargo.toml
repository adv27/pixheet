# The Rust version of Pixheet. Read spike/PLAN.md for the plan of the port.
[workspace]
resolver = "3"
members = ["crates/pixheet-core", "crates/pixheet-cli"]
# The desktop app joins the workspace when the crate pixheet-plan is ready.
exclude = ["crates/pixheet-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Dinh-Anh Vu <anhvd27@gmail.com>"]
repository = "https://github.com/adv27/pixheet"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1

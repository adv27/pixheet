# Pixheet: turn an image into an .xlsx spreadsheet where every cell is one pixel.
[workspace]
resolver = "3"
members = ["crates/pixheet-core", "crates/pixheet-cli", "crates/pixheet-app", "crates/xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Dinh-Anh Vu <anhvd27@gmail.com>"]
repository = "https://github.com/adv27/pixheet"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The image code is slow without optimization. Optimize it in the test and debug builds
# too, so the tests and `cargo run` stay fast. Only these crates: an optimized build of all
# dependencies (Tauri, GTK) makes each test build in CI minutes slower.
[profile.dev.package.pixheet-core]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[profile.dev.package.rayon]
opt-level = 3

[profile.dev.package.rayon-core]
opt-level = 3

# The C build of libjpeg-turbo follows this opt-level: 0 gives a debug build of the C code.
[profile.dev.package.turbojpeg]
opt-level = 3

[profile.dev.package.turbojpeg-sys]
opt-level = 3

# The golden test hashes and unzips about 280 XML parts.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

# The release files are small and fast:
# - fat LTO with one codegen unit, no unwind (a panic stops the program), no symbols;
# - opt-level "s" for the dependencies outside the image path (Tauri, GTK, serde, clap).
# On Linux, the command is 34% and the app 56% smaller than with thin LTO, the speed and
# the output are the same, and a release build takes about two times as long.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# "*" does not include the crates of the workspace: they keep opt-level 3. The binary
# crates must keep it: with "s" on pixheet-cli, a conversion took about 55% more time.
[profile.release.package."*"]
opt-level = "s"

# The crates of the image path, and the C code of libjpeg-turbo and mimalloc, keep
# opt-level 3. Keep this list complete: a new crate in the path of a conversion compiles
# at "s" and makes it slower. Compare with `cargo xtask bench` after a dependency change.
[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.tiff]
opt-level = 3

[profile.release.package.gif]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.adler2]
opt-level = 3

[profile.release.package.simd-adler32]
opt-level = 3

[profile.release.package.weezl]
opt-level = 3

[profile.release.package.rayon]
opt-level = 3

[profile.release.package.rayon-core]
opt-level = 3

[profile.release.package.turbojpeg]
opt-level = 3

[profile.release.package.turbojpeg-sys]
opt-level = 3

[profile.release.package.mimalloc]
opt-level = 3

[profile.release.package.libmimalloc-sys]
opt-level = 3

[profile.release.package.itoa]
opt-level = 3

[profile.release.package.moxcms]
opt-level = 3

[profile.release.package.bytemuck]
opt-level = 3

[profile.release.package.byteorder-lite]
opt-level = 3

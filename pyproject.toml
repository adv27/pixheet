[project]
name = "pixheet"
version = "0.1.0"
description = "Turn any image into an .xlsx spreadsheet where every cell is one pixel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dinh-Anh Vu", email = "anhvd27@gmail.com" }]
requires-python = ">=3.15"
dependencies = ["pillow>=13.0.0"]
keywords = ["image", "xlsx", "spreadsheet", "pixel-art", "converter"]
classifiers = [
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The desktop app: tkinterdnd2 adds the drop of files from the file manager.
gui = [
    "sv-ttk>=2.6.1,<3",
    "tkinterdnd2>=0.6.4,<0.7",
]

[project.scripts]
pixheet = "pixheet.cli:main"

[project.gui-scripts]
pixheet-gui = "pixheet.gui:main"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "sv-ttk>=2.6.1,<3",
    "tkinterdnd2>=0.6.4,<0.7",
    "xlsxwriter>=3.2.9",
]
# The one-file desktop app for Windows and Linux: packaging/build.ps1 and packaging/build.sh.
build = ["pyinstaller>=6.22.3", "pyinstaller-hooks-contrib>=2026.8"]

[tool.uv]
# The oldest uv that can use this project. A newer uv also works, so the README commands
# work with the uv of the user. The CI workflows install one exact uv version: read the
# "version" input of each setup-uv step.
required-version = ">=0.13.1"
# Use only a Python that uv installs (python-build-standalone), also when the computer has
# a different Python 3.15. Then the CI jobs, the release builds and a local build all use
# the same Python build on Windows and on Linux.
python-preference = "only-managed"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest]
testpaths = ["tests"]
# Capture sys.stdout and sys.stderr, not file descriptors 1 and 2. With fd capture, Tcl on
# Windows keeps the handles of fd 1 and 2 after pytest closes them. A new file can then get
# the same handle, and Tcl cannot open it: sv-ttk fails with "couldn't read file".
addopts = ["-ra", "--strict-markers", "--capture=sys"]
filterwarnings = [
    "error",
    # With -p no:faulthandler, pytest does not know the faulthandler options below.
    "ignore:Unknown config option. faulthandler_(timeout|exit_on_timeout)$:pytest.PytestConfigWarning",
]
# After 60 s, a hung test prints the stack of each thread, and the run stops with an error.
faulthandler_timeout = "60"
faulthandler_exit_on_timeout = true

# CI runs "pytest --cov". A plain "pytest" does not measure coverage, so it stays fast.
[tool.coverage.run]
source = ["pixheet"]
branch = true
# Write the paths of the files relative to the repository root, for example
# src/pixheet/core.py. Codecov then finds each file in the repository.
relative_files = true
# The default concurrency ["thread"] also measures the worker threads of the GUI and of
# _threads.py. Thus the file does not set it.

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "PTH", "PERF"]

[tool.ruff.lint.per-file-ignores]
# Long XML string literals read best unbroken.
"src/pixheet/_xlsx.py" = ["E501"]

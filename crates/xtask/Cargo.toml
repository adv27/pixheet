[package]
name = "xtask"
description = "The tasks of the project: samples, benchmark, release notes and release plan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# The tasks that read or write images. The release job turns them off, so it does not
# build libjpeg-turbo: cargo run -p xtask --no-default-features -- release-plan ...
default = ["images"]
images = ["dep:image", "dep:pixheet-core"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
pixheet-core = { path = "../pixheet-core", optional = true }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
# The tests of the binary write images for sample-pixels and bench.
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[lints]
workspace = true

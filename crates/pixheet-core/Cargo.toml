[package]
name = "pixheet-core"
description = "Turn an image into an .xlsx spreadsheet where every cell is one pixel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = ["turbo"]
# Decode JPEG with libjpeg-turbo, as Pillow does. Then the pixels are the same as in the
# Python version. The build needs cmake and nasm.
turbo = ["dep:turbojpeg"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
itoa = "1.0"
rayon = "1.12"
rustc-hash = "2.1"
same-file = "1.0"
turbojpeg = { version = "1.5", features = ["cmake"], optional = true }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[package]
name = "pixheet-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Spike: the pixheet CLI in Rust, to measure the speed and the parity with Pillow."
license = "MIT"

[[bin]]
name = "pixheet-rs"
path = "src/main.rs"

[features]
default = []
# Decode JPEG with libjpeg-turbo, as Pillow does. It needs cmake and nasm to build.
turbo = ["dep:turbojpeg"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
fast_image_resize = { version = "6.1", features = ["rayon"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
itoa = "1.0"
rayon = "1.12"
rustc-hash = "2.1"
turbojpeg = { version = "1.5", features = ["cmake"], optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

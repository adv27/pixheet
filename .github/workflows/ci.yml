# Tests and lint on a GitHub-hosted Windows runner.
# The job runs on a new virtual machine each time, and its token can only read the
# repository. A pull request from a fork gets no secrets. Read packaging/README.md.
# The test job sends the coverage and the test results to Codecov. Only this workflow
# uses the secret CODECOV_TOKEN.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # check out the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and lint
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv reads the uv version from pyproject.toml and the Python version from
      # .python-version.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install the dependencies
        run: uv sync --locked --extra gui

      # Only CI measures the coverage. A plain "uv run pytest" stays fast.
      - name: Run the tests
        run: >-
          uv run --locked --extra gui pytest --cov --cov-branch --cov-report=xml
          --junitxml=junit.xml -o junit_family=legacy

      # A pull request from a fork gets no secrets. Then the token is empty, and Codecov
      # accepts the upload without a token, because the repository is public. An upload
      # without a token can fail, so it does not stop the job.
      - name: Upload the coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      # Upload the test results also when a test fails. Codecov then shows the failed tests.
      - name: Upload the test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          disable_search: true
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: Lint
        run: uv run --locked --extra gui ruff check

      - name: Check the format
        run: uv run --locked --extra gui ruff format --check

  version:
    name: Check the version tag
    # A merge that changes the version publishes a release, but only when the tag
    # v<version> does not exist yet. Thus a pull request that changes the version to a
    # version with a tag fails here. Then the merge cannot skip the release silently.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository is public. Thus git can read the base commit and the tags without
      # a token, also for a pull request from a fork.
      - name: Check that a new version has no tag yet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 --no-tags origin "$BASE_SHA"
          git show "$BASE_SHA:pyproject.toml" > "$RUNNER_TEMP/base-pyproject.toml"
          python3 packaging/release_version.py check-pr "$RUNNER_TEMP/base-pyproject.toml"

# Build the command and the desktop app for Windows, Linux and macOS on GitHub-hosted
# runners, and publish the release.
#
# - build makes pixheet-cli-<system> and pixheet-app-<system>, each with a .sha256 file.
#   Linux builds on Ubuntu 22.04, so the files need glibc 2.35 or later.
# - The release job publishes the files in the GitHub release "Pixheet v<version>". The
#   notes come from CHANGELOG.md (cargo xtask release-notes).
#
# Each job runs on a new virtual machine, and GitHub deletes the machine after the job.
# This workflow publishes releases, so it uses no cache: a file from a cache could go into
# a release.
#
# Security: the repository is public. A pull request from a fork can run the build jobs,
# because the trigger is pull_request. For pull_request, GitHub gives no secrets and a
# token that can only read. Do not use pull_request_target: it gives the secrets and a
# token that can write. Only the release job can write, and it never runs for a pull
# request.
#
# The release job runs only when all builds pass:
# - For a push to master. The version in Cargo.toml gives the tag v<version>.
#   - When the tag does not exist, the job makes it at the commit of the push.
#   - When the tag exists at the commit of the push, an earlier run made it. The job adds
#     the files that the release does not have.
#   - When the tag exists at a different commit, the job does nothing if the release of
#     the tag is published. Without a published release, the job stops with an error.
# - For a push of a tag "v<version>". The tag must agree with the version.
# cargo xtask release-plan decides each step. Read crates/xtask/src/release.rs.
name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  # A pull request runs the builds only when it changes something that the release files
  # depend on. A push to master always runs them.
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: {}

# One run at a time for each ref. A new run of a pull request cancels the old run. A push
# to master never cancels a run that has started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Read the version of the workspace
        id: version
        run: echo "version=$(cargo run -q --locked -p xtask --no-default-features -- version)" >> "$GITHUB_OUTPUT"

      - name: Check that the tag agrees with the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::The tag $TAG does not agree with the version $VERSION in Cargo.toml."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            exe: .exe
          - target: linux-x64
            os: ubuntu-22.04
            exe: ""
          - target: macos-arm64
            os: macos-15
            exe: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup installs the toolchain of rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install nasm and the libraries of the app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Build the command and the app
        run: cargo build --release --locked -p pixheet-cli -p pixheet-app

      # Each file gets a .sha256 file with its name only, so sha256sum -c works in the
      # folder of the download.
      - name: Name the files and write the checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir dist
          cp "target/release/pixheet$EXE" "dist/pixheet-cli-$TARGET$EXE"
          cp "target/release/pixheet-app$EXE" "dist/pixheet-app-$TARGET$EXE"
          cd dist
          for file in *; do
            if command -v sha256sum > /dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "$file.sha256"
          done
          ls -l

      - name: Convert a sample with the built command
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          "dist/pixheet-cli-$TARGET$EXE" --version
          "dist/pixheet-cli-$TARGET$EXE" crates/pixheet-core/tests/fixtures/photo.jpg -o "$RUNNER_TEMP/photo.xlsx"

      - name: Upload the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixheet-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: [version, build]
    # A push to master, a push of a v* tag, or a manual start on master. Never a pull
    # request, and never a manual start on a different branch.
    if: >-
      (github.event_name == 'push'
        && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # make the tag, create the release and upload the files
    # One release job at a time, for all refs. The group never cancels a job that has
    # started.
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      # A missing section in CHANGELOG.md stops the job before it makes the tag.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: cargo run -q --locked -p xtask --no-default-features -- release-notes "$VERSION" > "$RUNNER_TEMP/notes.md"

      # A tag that GITHUB_TOKEN makes does not start a new workflow run. This is correct,
      # because this job publishes the release itself.
      - name: Make the tag of the version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            # The version job made sure that the tag agrees with the version.
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::The version job did not give the version."
            exit 1
          fi
          tag="v$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          url="https://github.com/$REPO.git"
          plan() { cargo run -q --locked -p xtask --no-default-features -- release-plan "$@"; }

          # Print the commit of the tag $1 on GitHub, or nothing when the tag does not
          # exist. For an annotated tag, the line that ends with ^{} gives the commit.
          tag_commit() {
            local lines status=0
            lines=$(git ls-remote --exit-code "$url" "refs/tags/$1" "refs/tags/$1^{}") || status=$?
            if [[ $status -eq 2 ]]; then return 0; fi
            if [[ $status -ne 0 ]]; then
              echo "::error::git ls-remote stopped with exit code $status." >&2
              return 1
            fi
            printf '%s\n' "$lines" | sort -k2 | tail -n 1 | cut -f1
          }

          # Print the state of the release of the tag $1: none, draft or published.
          release_state() {
            local draft err="$RUNNER_TEMP/gh-release-state.err"
            if draft=$(gh release view "$1" --repo "$REPO" --json isDraft --jq .isDraft 2>"$err"); then
              if [[ "$draft" == true ]]; then echo draft; else echo published; fi
            elif [[ "$(<"$err")" == *"release not found"* ]]; then
              echo none
            else
              echo "::error::gh cannot read the release $1: $(<"$err")" >&2
              return 1
            fi
          }

          plan_tag() {
            commit=$(tag_commit "$tag")
            release=$(release_state "$tag")
            if ! action=$(plan tag "$tag" "$SHA" "$commit" "$release"); then
              printf '%s\n' "$action"
              exit 1
            fi
          }

          plan_tag
          if [[ "$action" == skip ]]; then
            echo "The tag $tag exists already, at a different commit $commit. The release $tag is published. The job does not publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$action" == publish ]]; then
            echo "The tag $tag exists already, at $SHA. The job publishes the files that are missing."
          elif gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA" > /dev/null; then
            echo "The job made the tag $tag at $SHA."
          else
            # A different job can make the same tag at the same time.
            plan_tag
            if [[ "$action" == publish ]]; then
              echo "The tag $tag exists already, at $SHA. The job continues."
            else
              echo "::error::The job cannot make the tag $tag."
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the files of the builds
        if: steps.tag.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pixheet-*
          path: dist
          merge-multiple: true

      # The job never replaces a file of a published release, because users can have
      # downloaded it already. It uploads only the files that the release does not have.
      # gh release create makes a draft, uploads the files, and then publishes the draft.
      # For a draft that an earlier run left, the job uploads the missing files and then
      # publishes the draft. The job counts only the files with the state "uploaded".
      - name: Create the release, or add the missing files to it
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          plan() { cargo run -q --locked -p xtask --no-default-features -- release-plan "$@"; }
          mapfile -t files < <(cargo run -q --locked -p xtask --no-default-features -- release-files)
          (cd dist && sha256sum -c ./*.sha256)
          release=none
          assets=""
          err="$RUNNER_TEMP/gh-release-view.err"
          if view=$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets --jq '.isDraft, (.assets[] | select(.state == "uploaded") | .name)' 2>"$err"); then
            mapfile -t found <<< "$view"
            release=published
            if [[ "${found[0]}" == true ]]; then
              release=draft
            fi
            assets=$(printf '%s\n' "${found[@]:1}")
          elif [[ "$(<"$err")" != *"release not found"* ]]; then
            echo "::error::gh cannot read the release $TAG: $(<"$err")"
            exit 1
          fi
          if ! result=$(printf '%s\n' "$assets" | plan upload "$release" "${files[@]}"); then
            printf '%s\n' "$result"
            exit 1
          fi
          mapfile -t lines <<< "$result"
          action=${lines[0]}
          missing=("${lines[@]:1}")
          cd dist
          case "$action" in
            create)
              gh release create "$TAG" "${missing[@]}" --repo "$REPO" \
                --verify-tag --title "Pixheet $TAG" \
                --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
              ;;
            upload)
              echo "The release $TAG exists. The job uploads: ${missing[*]}"
              gh release upload "$TAG" "${missing[@]}" --repo "$REPO"
              ;;
            publish)
              if (( ${#missing[@]} > 0 )); then
                echo "The release $TAG is a draft. The job uploads: ${missing[*]}"
                gh release upload "$TAG" "${missing[@]}" --repo "$REPO" --clobber
              fi
              echo "The job publishes the draft release $TAG."
              gh release edit "$TAG" --repo "$REPO" --draft=false
              ;;
            done)
              echo "The release $TAG has all files. The job has nothing to do."
              ;;
            *)
              echo "::error::cargo xtask release-plan gave the unknown action $action."
              exit 1
              ;;
          esac

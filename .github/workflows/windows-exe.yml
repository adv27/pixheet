# Build Pixheet.exe on a GitHub-hosted Windows runner.
#
# Each job runs on a new virtual machine, and GitHub deletes the machine after the job.
# Thus no file from an earlier job can go into the exe.
#
# Security: the repository is public. A pull request from a fork can run this workflow,
# because the trigger is pull_request. For pull_request, GitHub gives no secrets and a
# token that can only read. Do not use pull_request_target. It gives the secrets and a
# token that can write.
#
# Before you move the build job to a self-hosted runner, you MUST remove the pull_request
# trigger. Read "Later: self-hosted runner" in packaging/README.md.
#
# The release job publishes the exe in a GitHub release "Pixheet v<version>":
# - For a push to master, when the tag v<version> of the version in pyproject.toml does not
#   exist yet. The job makes the tag. When the tag exists, the job does nothing.
# - For a push of a tag "v<version>". The tag must agree with the version.
# Only the release job can write to the repository. It never runs for a pull request.
name: Windows exe

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Pixheet.exe
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read # check out the code
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        # Windows PowerShell 5.1 is on each Windows machine. pwsh is not always there.
        shell: powershell
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv reads the uv version from pyproject.toml and the Python version from
      # .python-version. This workflow publishes releases. Thus it does not use the GitHub
      # Actions cache, because a file from the cache can go into the exe.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      # The build group includes pefile. Thus the test that compares the PE checksum with
      # pefile runs here. It does not skip.
      - name: Install the dependencies
        run: uv sync --locked --extra gui --group build

      # The script reads pyproject.toml with tomllib. The release job uses the version.
      - name: Read the package version
        id: version
        run: |
          $version = uv run --locked --extra gui --group build python packaging/release_version.py version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check that the tag agrees with the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG -ne "v$env:VERSION") {
            Write-Host "::error::The tag $env:TAG does not agree with the version $env:VERSION in pyproject.toml."
            exit 1
          }

      - name: Run the tests
        run: uv run --locked --extra gui --group build pytest

      - name: Build and test the exe
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Upload the exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pixheet-windows-x64
          path: |
            dist/Pixheet.exe
            dist/Pixheet.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: build
    # A push to master, a push of a v* tag, or a manual start on master. Never a pull
    # request, and never a manual start on a different branch.
    if: >-
      (github.event_name == 'push'
        && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # make the tag, create the release and upload the files
    # One release job at a time, for all refs. When two merges come quickly, the second job
    # waits. Then it finds the tag of the first job and does nothing.
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    steps:
      # For a push to master, the job makes the tag v<version> at the commit of the push.
      # A tag that GITHUB_TOKEN makes does not start a new workflow run. This is correct,
      # because this job publishes the release itself. Do not use a different token to
      # start a run for the tag. Then the release job runs two times for one version.
      - name: Make the tag of the version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            # The build job made sure that the tag agrees with the version.
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::The build job did not give the version."
            exit 1
          fi
          tag="v$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          url="https://github.com/$REPO.git"

          # Print the commit of the tag $1 on GitHub. Print nothing when the tag does not
          # exist. For an annotated tag, the line that ends with ^{} gives the commit.
          tag_commit() {
            local lines status=0
            lines=$(git ls-remote --exit-code "$url" "refs/tags/$1" "refs/tags/$1^{}") || status=$?
            if [[ $status -eq 2 ]]; then return 0; fi
            if [[ $status -ne 0 ]]; then
              echo "::error::git ls-remote stopped with exit code $status." >&2
              return 1
            fi
            printf '%s\n' "$lines" | sort -k2 | tail -n 1 | cut -f1
          }

          commit=$(tag_commit "$tag")
          if [[ -n "$commit" ]]; then
            echo "The tag $tag exists already, at $commit. The job does not publish a release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA" > /dev/null; then
            echo "The job made the tag $tag at $SHA."
          else
            # A different job can make the same tag at the same time.
            commit=$(tag_commit "$tag")
            if [[ "$commit" == "$SHA" ]]; then
              echo "The tag $tag exists already, at $SHA. The job continues."
            elif [[ -n "$commit" ]]; then
              echo "::error::The tag $tag exists already, at a different commit $commit, not $SHA."
              exit 1
            else
              echo "::error::The job cannot make the tag $tag."
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the exe
        if: steps.tag.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Pixheet-windows-x64
          path: dist

      # The job never replaces a file of a published release, because users can have
      # downloaded it already. A new build of the same commit can also give a different
      # exe, for example with a newer patch release of Python. To replace a file, delete
      # it in the release by hand, then run again.
      - name: Create the release, or add the files to it
        if: steps.tag.outputs.publish == 'true'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sha256sum -c Pixheet.exe.sha256
          if assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2> /dev/null); then
            for name in Pixheet.exe Pixheet.exe.sha256; do
              if printf '%s\n' "$assets" | grep -qxF "$name"; then
                echo "::error::The release $TAG already has $name. The job does not replace it. Delete the file in the release by hand, then run the job again."
                exit 1
              fi
            done
            gh release upload "$TAG" Pixheet.exe Pixheet.exe.sha256 --repo "$REPO"
          else
            gh release create "$TAG" Pixheet.exe Pixheet.exe.sha256 --repo "$REPO" \
              --verify-tag --title "Pixheet $TAG" --generate-notes
          fi

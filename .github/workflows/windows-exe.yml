# Build Pixheet.exe on the self-hosted Windows runner of the project.
#
# Security: the repository is public. A pull request from a fork must never run code on
# the self-hosted runner. Thus this workflow has no pull_request trigger and no
# pull_request_target trigger. Do not add them. Only a push to master, a push of a v*
# tag, and a manual start run it.
#
# A pull request from a fork can change this file. Thus the runner itself must refuse
# untrusted jobs: its job-started hook, packaging/runner_job_started.ps1, runs only this
# workflow from master or from a v* tag. If you rename this file, change the hook too.
#
# A push of a tag "v<version>" also publishes the exe in a GitHub release. A
# GitHub-hosted runner does that step, so the token that can write never goes to the
# self-hosted runner.
name: Windows exe

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pixheet.exe
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    permissions:
      contents: read # check out the code
    defaults:
      run:
        # Windows PowerShell 5.1 is on each Windows machine. pwsh is not always there.
        shell: powershell
    steps:
      # A self-hosted runner keeps its files from the last job.
      - name: Clean the workspace
        run: |
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Remove-Item -Recurse -Force

      # This workflow publishes releases. Thus no file from an earlier job can go into
      # the exe. The runner empties RUNNER_TEMP at the start and at the end of each job,
      # so uv keeps its cache and its Python there, not in the profile of the runner
      # account. setup-uv downloads uv again and checks its SHA256.
      - name: Use new folders for uv and Python
        run: |
          "UV_CACHE_DIR=$env:RUNNER_TEMP\uv-cache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_PYTHON_INSTALL_DIR=$env:RUNNER_TEMP\uv-python" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($env:RUNNER_TOOL_CACHE) {
            $uv = Join-Path $env:RUNNER_TOOL_CACHE 'uv'
            if (Test-Path -LiteralPath $uv) { Remove-Item -LiteralPath $uv -Recurse -Force }
          }

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv reads the uv version from pyproject.toml and the Python version from
      # .python-version. enable-cache: false turns off only the GitHub Actions cache.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      - name: Check that the tag agrees with the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = uv version --short
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($env:TAG -ne "v$version") {
            Write-Host "::error::The tag $env:TAG does not agree with the version $version in pyproject.toml."
            exit 1
          }

      - name: Install the dependencies
        run: uv sync --locked --extra gui --group build

      - name: Run the tests
        run: uv run --locked --extra gui --group build pytest

      - name: Build and test the exe
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Upload the exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pixheet-windows-x64
          path: |
            dist/Pixheet.exe
            dist/Pixheet.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Clean the workspace
        if: always()
        run: |
          foreach ($name in 'dist', 'build', '.venv') {
            $path = Join-Path $env:GITHUB_WORKSPACE $name
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload the files
    steps:
      - name: Download the exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Pixheet-windows-x64
          path: dist

      # The job never replaces a file of a published release, because users can have
      # downloaded it already. A new build gives a different exe, also from the same
      # commit. To replace a file, delete it in the release by hand, then run again.
      - name: Create the release, or add the files to it
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c Pixheet.exe.sha256
          if assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2> /dev/null); then
            for name in Pixheet.exe Pixheet.exe.sha256; do
              if printf '%s\n' "$assets" | grep -qxF "$name"; then
                echo "::error::The release $TAG already has $name. The job does not replace it. Delete the file in the release by hand, then run the job again."
                exit 1
              fi
            done
            gh release upload "$TAG" Pixheet.exe Pixheet.exe.sha256 --repo "$REPO"
          else
            gh release create "$TAG" Pixheet.exe Pixheet.exe.sha256 --repo "$REPO" \
              --verify-tag --title "Pixheet $TAG" --generate-notes
          fi
